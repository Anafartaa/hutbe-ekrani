<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123336">
<title>Hutbe Kumandası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* Tek elle kullanım: üstte "şu an ekranda ne var", ortada büyük İleri/Geri, altta ekran seçimi, en altta dokunulabilir cümle listesi */
  :root {
    --bar: #123336; --bar-2: #1a4649; --bar-fg: #e9f2f0;
    --bg: #eef1ef; --surface: #ffffff; --sunk: #f5f7f5; --line: #dbe2df; --fg: #18211f; --muted: #5f6d6a;
    --teal: #1d5b5f; --teal-ink: #0f3b3e; --brass: #b08a3a; --brass-soft: #f6eedb; --live: #2b8a4b; --danger: #b3392f;
    --ui: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; --text: 'Noto Sans', 'Segoe UI', Arial, sans-serif;
    --r: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1415; --surface: #162022; --sunk: #111a1b; --line: #263335; --fg: #e5edeb; --muted: #93a29f;
      --teal: #3f9ea2; --teal-ink: #9fd8da; --brass: #d6b061; --brass-soft: #2a2416; --live: #4fbf73; --danger: #e0675c; color-scheme: dark; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--ui); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .wrap { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); max-width: 560px; margin: 0 auto; }

  /* Üst bölüm: koyu zemin üstünde ekrandaki durum */
  .top { background: linear-gradient(180deg, var(--bar) 0%, var(--bar-2) 100%); color: var(--bar-fg); padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 18px; }
  .hdr { display: flex; align-items: center; gap: 10px; }
  .hdr .name { flex: 1; min-width: 0; }
  .hdr .name small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; font-weight: 700; }
  .hdr .name b { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.09); white-space: nowrap; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: #9aa; }
  .conn[data-s="on"] i { background: #5fd38a; box-shadow: 0 0 0 3px rgba(95,211,138,.22); }
  .conn[data-s="warn"] i { background: #e7b84f; }
  .conn[data-s="err"] i { background: #f07a70; }

  .now { margin-top: 16px; display: grid; gap: 10px; }
  .meta { display: flex; align-items: center; gap: 10px; }
  .num { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .num span { font-size: 18px; font-weight: 600; opacity: .55; }
  .chip { margin-left: auto; font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 5px 10px; border-radius: 8px; background: rgba(255,255,255,.1); }
  .chip[data-k="splash"] { background: rgba(214,176,97,.25); color: #f3dca6; }
  .chip[data-k="blank"] { background: #000; color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
  .prog { height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--brass); border-radius: 4px; transition: width .3s ease; }
  .cur { font: 600 19px/1.42 var(--text); min-height: 2.84em; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .nxt { font: 14px/1.4 var(--text); opacity: .68; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nxt b { font: 700 11px var(--ui); letter-spacing: .1em; text-transform: uppercase; opacity: .8; margin-right: 6px; }

  main { display: grid; gap: 12px; margin-top: -2px; padding-top: 14px; }

  .nav { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; }
  .nav button { height: 104px; border-radius: var(--r); font-size: 19px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .08s ease; }
  .nav button:active { transform: scale(.97); }
  .nav svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  #bPrev { background: var(--surface); border: 1px solid var(--line); }
  #bNext { background: var(--teal); color: #fff; box-shadow: 0 8px 20px -12px var(--teal); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  .mic { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .mic .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
  .mic[data-on="true"] .dot { background: var(--live); box-shadow: 0 0 0 4px color-mix(in srgb, var(--live) 22%, transparent); animation: pulse 1.6s infinite; }
  .mic[data-err="true"] .dot { background: var(--danger); animation: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--live) 8%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .mic .dot { animation: none !important; } .prog i { transition: none; } }
  .mic .st b { display: block; font-size: 16px; }
  .mic .st span { display: block; font-size: 13px; color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .mic .st { min-width: 0; }
  #bListen { height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 800; font-size: 15px; background: var(--live); color: #fff; }
  #bListen[data-on="true"] { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 40%, transparent); }

  .screen { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { min-height: 44px; border-radius: 9px; font-weight: 700; font-size: 15px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12), inset 0 0 0 1px var(--line); }
  .seg button[data-k="splash"][aria-pressed="true"] { color: var(--brass); }
  #bBlank { min-width: 92px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  #bBlank svg { width: 18px; height: 18px; fill: currentColor; }
  #bBlank[aria-pressed="true"] { background: #000; color: #fff; border-color: #000; }

  .list { padding: 0; overflow: hidden; gap: 0; }
  .list-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
  #bFirst { font-size: 14px; font-weight: 700; color: var(--teal-ink); padding: 6px 10px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); }
  #list { position: relative; list-style: none; margin: 0; padding: 0 6px 8px; max-height: 58vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #list li { display: grid; grid-template-columns: 2.4em minmax(0, 1fr); gap: 4px; padding: 11px 10px; border-radius: 10px; font: 15px/1.42 var(--text); cursor: pointer; }
  #list li + li { border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  #list li:active { background: var(--sunk); }
  #list li .n { color: var(--muted); font: 700 13px/1.75 var(--ui); font-variant-numeric: tabular-nums; }
  #list li.done { color: var(--muted); }
  #list li.cur { background: var(--brass-soft); border-color: transparent; box-shadow: inset 3px 0 0 var(--brass); }
  #list li.cur .n { color: var(--brass); }
  #list li.special span:last-child { font-family: var(--ui); font-weight: 700; color: var(--brass); }

  button:disabled { opacity: .45; cursor: default; }
  .empty { text-align: center; color: var(--muted); padding: 22px 8px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
  .ask { position: fixed; inset: 0; background: rgba(8,18,18,.55); display: grid; place-items: end center; z-index: 30; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .ask > div { background: var(--surface); border-radius: 18px; padding: 18px; max-width: 480px; width: 100%; display: grid; gap: 14px; }
  .ask p { margin: 0; font-size: 17px; font-weight: 600; }
  .ask .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ask .btns button { min-height: 50px; border-radius: 12px; font-weight: 800; background: var(--sunk); border: 1px solid var(--line); }
  .ask .btns .yes { background: var(--teal); color: #fff; border-color: var(--teal); }
</style>
</head>
<body>
<section class="top">
  <div class="wrap">
    <div class="hdr">
      <div class="name"><small>Hutbe kumandası</small><b id="title">Bağlanıyor…</b></div>
      <span class="conn" id="conn" data-s="off"><i></i><span id="connText">Bağlanıyor</span></span>
    </div>
    <div class="now" aria-live="polite">
      <div class="meta"><div class="num" id="num">–</div><span class="chip" id="chip" data-k="hutbe">Hutbe</span></div>
      <div class="prog" aria-hidden="true"><i id="prog"></i></div>
      <div class="cur" id="curText">—</div>
      <div class="nxt" id="nextLine"><b>Sıradaki</b><span id="nextText">—</span></div>
    </div>
  </div>
</section>

<main class="wrap">
  <p class="empty" id="noRoom" hidden>Bu bağlantı eksik ya da eski. Bilgisayarda <b>Telefon kumandası</b> düğmesine basıp çıkan QR kodu yeniden okutun.</p>

  <div class="nav">
    <button id="bPrev" aria-label="Önceki"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Geri</button>
    <button id="bNext" aria-label="Sonraki"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>İleri</button>
  </div>

  <div class="panel mic" id="micBox" data-on="false">
    <span class="dot" aria-hidden="true"></span>
    <div class="st"><b id="micText">Mikrofon kapalı</b><span id="heard"></span></div>
    <button id="bListen" data-on="false">Dinlemeyi başlat</button>
  </div>

  <div class="panel">
    <div class="lbl">Projeksiyon</div>
    <div class="screen">
      <div class="seg" role="group" aria-label="Ekranda ne gösterilsin">
        <button data-k="hutbe" aria-pressed="true">Hutbe</button>
        <button data-k="splash" aria-pressed="false">Açılış</button>
      </div>
      <button id="bBlank" aria-pressed="false" title="Projeksiyonu simsiyah yap"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><rect x="9" y="18.5" width="6" height="1.5" rx=".75"/></svg>Karart</button>
    </div>
  </div>

  <div class="panel list">
    <div class="list-head"><span class="lbl">Cümleler · dokunarak geçin</span><button id="bFirst">Başa dön</button></div>
    <ol id="list"></ol>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden></div>
<div class="ask" id="ask" hidden><div><p id="askText"></p><div class="btns"><button id="askNo">Vazgeç</button><button class="yes" id="askYes">Evet</button></div></div></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const BROKERS = (window.HUTBE_KUMANDA_CFG && window.HUTBE_KUMANDA_CFG.brokers) || ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
  const hash = new URLSearchParams(location.hash.slice(1));
  const room = hash.get('r') || '';
  const secret = hash.get('k') || '';
  const broker = BROKERS[Math.min(+hash.get('b') || 0, BROKERS.length - 1)];
  const controls = () => document.querySelectorAll('#bPrev, #bNext, #bListen, .seg button, #bBlank, #bFirst');

  let st = null;          // bilgisayarın bildirdiği son durum
  let rows = [];
  let client = null;
  let connected = false;
  let lastMsgAt = 0;
  let pendingUntil = 0;   // az önce basılan düğmenin sonucunu bilgisayar onaylayana kadar yerel durumu koru

  function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
  function conn(text, s) { $('#connText').textContent = text; $('#conn').dataset.s = s; }
  function enable(on) { controls().forEach((b) => { b.disabled = !on; }); }

  if (!/^[a-z0-9]{12,}$/.test(room) || !/^[a-z0-9]{20,}$/.test(secret)) {
    $('#noRoom').hidden = false;
    conn('Kod yok', 'err');
    $('#title').textContent = 'QR kodu okutun';
    enable(false);
    return;
  }
  const base = `hutbe-ekran/v1/${room}/`;
  enable(false);

  // ---------- Bağlantı ----------
  function connect() {
    if (!window.mqtt) { conn('İnternet yok', 'err'); $('#title').textContent = 'Kumanda yüklenemedi'; return; }
    client = window.mqtt.connect(broker, { clientId: 'hutbe-tel-' + Math.random().toString(36).slice(2, 10), clean: true, connectTimeout: 8000, reconnectPeriod: 2000, keepalive: 20 });
    client.on('connect', () => {
      connected = true;
      client.subscribe([base + 'status', base + 'rows']);
      beat();
      send('ping', null, true);
      render();
    });
    client.on('close', () => { connected = false; render(); });
    client.on('offline', () => { connected = false; render(); });
    client.on('message', (topic, payload) => {
      let d;
      try { d = JSON.parse(String(payload)); } catch (e) { return; }
      lastMsgAt = Date.now();
      if (topic.endsWith('/rows') && Array.isArray(d)) { rows = d.map((x) => String(x)); renderList(); render(); return; }
      if (topic.endsWith('/status') && d && typeof d === 'object') {
        // Basılan düğmenin onayı gelene kadar (en çok 1,5 sn) telefonun kendi tahmini ekranda kalsın, geri sıçramasın
        if (Date.now() < pendingUntil && st && d.cur !== st.cur && d.rev === st.prevRev) return;
        st = d;
        pendingUntil = 0;
        render();
      }
    });
  }
  function beat() { if (client && connected) client.publish(base + 'phone', JSON.stringify({ t: Date.now() })); }
  setInterval(beat, 8000);
  setInterval(render, 3000);

  // Her komut, QR koddaki gizli anahtarla imzalanır (anahtar hiçbir zaman gönderilmez)
  let keyP = null;
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
  function signKey() {
    if (!keyP) keyP = crypto.subtle.importKey('raw', new TextEncoder().encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return keyP;
  }
  let outQ = Promise.resolve();
  function send(cmd, extra, quiet) {
    if (!client || !connected) { if (!quiet) toast('Bağlantı yok, yeniden bağlanıyor…'); return false; }
    if (!window.crypto || !crypto.subtle) { if (!quiet) toast('Bu tarayıcı güvenli bağlantıyı desteklemiyor.'); return false; }
    const d = Object.assign({ cmd, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), t: Date.now() }, extra || {});
    const text = [d.cmd, d.id, d.t, d.i === undefined ? '' : d.i, d.on === undefined ? '' : d.on].join('|');
    // sırayla gönder: art arda basılan İleri'ler karışmasın
    outQ = outQ.then(() => signKey()).then((k) => crypto.subtle.sign('HMAC', k, new TextEncoder().encode(text)))
      .then((sig) => { d.sig = hex(sig); if (client && connected) client.publish(base + 'cmd', JSON.stringify(d)); })
      .catch(() => {});
    if (!quiet && navigator.vibrate) navigator.vibrate(12);
    return true;
  }

  // Düğmeye basınca bilgisayarın cevabını beklemeden ekranı hemen güncelle (cevap gelince düzeltilir)
  function predict(fn) {
    if (!st) return;
    const prevRev = st.rev;
    st = Object.assign({}, st);
    fn(st);
    st.prevRev = prevRev;
    pendingUntil = Date.now() + 1500;
    render();
  }
  const last = () => Math.max(0, (st && st.total | 0) - 1);
  function doNext() {
    if (!send('next')) return;
    predict((s) => { if (s.splash) s.splash = false; else if (s.cur >= last()) { s.blank = true; s.autoBlank = true; } else s.cur++; });
  }
  function doPrev() {
    if (!send('prev')) return;
    predict((s) => { if (s.autoBlank) s.blank = s.autoBlank = false; else if (s.splash) return; else if (s.cur <= 0) s.splash = true; else s.cur--; });
  }
  function doGo(i) {
    if (!send('go', { i })) return;
    predict((s) => { s.cur = i; s.splash = false; if (s.autoBlank) s.blank = s.autoBlank = false; });
  }

  // ---------- Ekran ----------
  function stale() { return Date.now() - lastMsgAt > 45000; }
  function render() {
    if (!connected) { conn('Bağlanıyor', 'warn'); enable(false); return; }
    if (!st) { conn('Bilgisayar bekleniyor', 'warn'); $('#title').textContent = 'Bilgisayarda Hutbe Ekranı açık mı?'; enable(false); return; }
    if (st.online === false) { conn('Bilgisayar kapalı', 'err'); $('#title').textContent = 'Bilgisayarda Hutbe Ekranı kapalı'; enable(false); return; }
    enable(true);
    conn(stale() ? 'Bağlantı yavaş' : 'Bağlı', stale() ? 'warn' : 'on');
    $('#title').textContent = st.title || 'Hutbe';
    const total = st.total | 0;
    const cur = Math.min(st.cur | 0, Math.max(0, total - 1));
    const mode = st.blank ? 'blank' : st.splash ? 'splash' : 'hutbe';
    $('#num').innerHTML = total ? (st.splash ? 'Açılış' : `${cur + 1}<span> / ${total}</span>`) : '–';
    const chip = $('#chip');
    chip.dataset.k = mode;
    chip.textContent = { blank: st.autoBlank ? 'Hutbe bitti, ekran karartıldı' : 'Ekran karartıldı', splash: 'Açılış ekranı', hutbe: 'Hutbe' }[mode];
    $('#prog').style.width = total ? (st.splash ? 0 : ((cur + 1) / total) * 100) + '%' : '0';
    if (st.splash) {
      $('#curText').textContent = 'Projeksiyonda açılış ekranı var. İleri’ye basınca hutbe başlar.';
      $('#nextText').textContent = rows[0] || '—';
    } else if (st.autoBlank) {
      $('#curText').textContent = 'Hutbe bitti, projeksiyon karartıldı.';
      $('#nextText').textContent = 'Geri’ye basınca son cümle yeniden görünür.';
    } else {
      $('#curText').textContent = rows[cur] || '—';
      $('#nextText').textContent = rows[cur + 1] || (total ? 'Son cümle. Okunduktan 8 sn sonra ekran kendiliğinden kararır.' : '—');
    }
    const err = /hata|yok|kullanılamıyor|bulunamadı/i.test(st.mic || '');
    $('#micBox').dataset.on = String(!!st.listening);
    $('#micBox').dataset.err = String(err);
    $('#micText').textContent = st.mic || (st.listening ? 'Dinleniyor' : 'Mikrofon kapalı');
    $('#heard').textContent = st.listening && st.heard && st.heard !== '—' ? '“' + st.heard + '”' : (st.listening ? 'İmam konuşunca duyulan söz burada görünür' : '');
    const L = $('#bListen');
    L.dataset.on = String(!!st.listening);
    L.textContent = st.listening ? 'Durdur' : 'Dinlemeyi başlat';
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === (st.splash ? 'splash' : 'hutbe'))));
    $('#bBlank').setAttribute('aria-pressed', String(!!st.blank));
    markList();
  }

  function renderList() {
    const items = [`<li data-i="-1" class="special"><span class="n">·</span><span>Açılış ekranı</span></li>`]
      .concat(rows.map((t, i) => `<li data-i="${i}" role="button" tabindex="0"><span class="n">${i + 1}</span><span>${esc(t)}</span></li>`));
    $('#list').innerHTML = rows.length ? items.join('') : '<li class="empty">Bilgisayarda hutbe yüklenince cümleler burada görünür.</li>';
    lastMarked = null;
    markList();
  }
  let lastMarked = null;
  function markList() {
    if (!st) return;
    const cur = st.cur | 0;
    const key = st.splash ? '-1' : String(cur);
    document.querySelectorAll('#list li[data-i]').forEach((li) => {
      const i = li.dataset.i;
      li.classList.toggle('cur', i === key);
      li.classList.toggle('done', !st.splash && i !== '-1' && +i < cur);
    });
    if (key !== lastMarked) {
      const el = document.querySelector('#list li.cur');
      const box = $('#list');
      if (el) box.scrollTop = el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2; // listeyi kaydır, sayfayı değil
      lastMarked = key;
    }
  }

  function ask(text, yes) {
    return new Promise((res) => {
      $('#askText').textContent = text; $('#askYes').textContent = yes; $('#ask').hidden = false;
      const done = (v) => { $('#ask').hidden = true; res(v); };
      $('#askYes').onclick = () => done(true); $('#askNo').onclick = () => done(false);
    });
  }

  // ---------- Düğmeler ----------
  $('#bPrev').addEventListener('click', doPrev);
  $('#bNext').addEventListener('click', doNext);
  $('#bListen').addEventListener('click', async () => {
    const on = !(st && st.listening);
    if (!on && !(await ask('Dinleme durdurulsun mu? Ekran artık kendiliğinden ilerlemez.', 'Durdur'))) return;
    if (send('listen', { on })) predict((s) => { s.listening = on; s.mic = on ? 'Başlatılıyor…' : 'Mikrofon kapalı'; });
  });
  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-k]');
    if (!b || !st) return;
    const k = b.dataset.k;
    if (k === 'hutbe') { if (st.splash && send('splash', { on: false })) predict((s) => { s.splash = false; }); }
    if (k === 'splash' && send('splash', { on: true })) predict((s) => { s.splash = true; if (s.autoBlank) s.blank = s.autoBlank = false; });
  });
  $('#bBlank').addEventListener('click', () => { const on = !(st && st.blank); if (send('blank', { on })) predict((s) => { s.blank = on; s.autoBlank = false; }); });
  $('#bFirst').addEventListener('click', async () => { if (await ask('Hutbe başa alınsın mı?', 'Başa dön') && send('first')) predict((s) => { s.cur = 0; s.splash = false; if (s.autoBlank) s.blank = s.autoBlank = false; }); });
  // Cümleye dokun: oraya geç
  function pick(li) {
    if (!li || !st) return;
    const i = li.dataset.i;
    if (i === '-1') { if (send('splash', { on: true })) predict((s) => { s.splash = true; if (s.autoBlank) s.blank = s.autoBlank = false; }); }
    else if (/^\d+$/.test(i)) doGo(+i);
  }
  $('#list').addEventListener('click', (e) => pick(e.target.closest('li[data-i]')));
  $('#list').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e.target.closest('li[data-i]')); } });

  // Telefon ekranı kumanda açıkken kararmasın; uygulamaya geri dönünce hemen güncel durumu iste
  let lock = null;
  async function awake() { try { if (!lock && navigator.wakeLock && document.visibilityState === 'visible') { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) { /* desteklenmiyor */ } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { awake(); if (client && !connected) client.reconnect(); beat(); send('ping', null, true); } });
  awake();

  connect();
})();
</script>
</body>
</html>
