<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173f42">
<title>Hutbe Kumandası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* Telefonda tek elle kullanım: üstte okunan cümle, ortada büyük İleri/Geri, altta ekran düğmeleri ve cümle listesi */
  :root {
    --bar: #173f42; --bar-fg: #e8f0ee; --bg: #f3f5f3; --surface: #fff; --line: #dde3e0; --fg: #1b2526; --muted: #64716f;
    --teal: #1f5f63; --brass: #b8913e; --live: #2f8a4c; --danger: #b4392f; --cur: #fbf4e3;
    --ui: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; --text: 'Noto Sans', 'Segoe UI', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1617; --surface: #182224; --line: #2a3739; --fg: #e4ecea; --muted: #93a3a1; --teal: #4fa3a6; --brass: #d4ad5c; --live: #56c27a; --danger: #e0685e; --cur: #2b2716; --bar: #0c1314; color-scheme: dark; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--ui); padding-bottom: env(safe-area-inset-bottom, 0px); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-fg);
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: 12px; }
  header .t { flex: 1; min-width: 0; line-height: 1.2; }
  header .t b { display: block; font-size: 15px; }
  header .t span { font-size: 13px; opacity: .75; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .6; }
  .pill[data-s="on"] { background: rgba(86,194,122,.2); color: #b9f0c9; }
  .pill[data-s="on"]::before { background: #56c27a; opacity: 1; }
  .pill[data-s="err"] { background: rgba(224,104,94,.22); color: #ffd1cc; }

  main { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .now { display: grid; gap: 8px; }
  .now .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .now .no { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; }
  .now .no b { font-size: 22px; color: var(--brass); }
  .now .cur { font: 600 19px/1.4 var(--text); min-height: 2.8em; }
  .now .nxt { font: 14px/1.4 var(--text); color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
  .now .scr { font-size: 13px; font-weight: 700; color: var(--brass); }

  .nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .nav button { height: 108px; border-radius: 16px; font-size: 20px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .nav svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  #bPrev { background: var(--surface); border: 1px solid var(--line); }
  #bNext { background: var(--teal); color: #fff; }
  .nav button:active { transform: scale(.98); }

  .mic { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .mic .st { font-weight: 600; }
  .mic .heard { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1.3em; }
  #bListen { height: 48px; padding: 0 18px; border-radius: 999px; background: var(--live); color: #fff; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  #bListen[data-on="true"] { background: var(--danger); }
  #bListen::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  #bListen[data-on="true"]::before { border-radius: 2px; }

  .screens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .screens button, .wide { min-height: 52px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 15px; padding: 6px; }
  .screens button[aria-pressed="true"] { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 20%, var(--surface)); }
  #bBlank[aria-pressed="true"] { background: #000; color: #fff; border-color: #000; }
  .wide { width: 100%; }

  details.card { padding: 0; }
  details summary { padding: 14px 16px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  details summary::after { content: '▾'; color: var(--muted); }
  details[open] summary::after { content: '▴'; }
  #list { list-style: none; margin: 0; padding: 0 6px 8px; max-height: 60vh; overflow: auto; }
  #list li { display: grid; grid-template-columns: 2.2em 1fr; gap: 6px; padding: 10px; border-radius: 10px; font: 15px/1.4 var(--text); }
  #list li .n { color: var(--muted); font: 600 13px/1.8 var(--ui); font-variant-numeric: tabular-nums; }
  #list li.cur { background: var(--cur); box-shadow: inset 3px 0 0 var(--brass); }
  #list li.done { color: var(--muted); }

  button:disabled { opacity: .4; cursor: default; }
  .msg { text-align: center; color: var(--muted); padding: 24px 8px; }
  .ask { position: fixed; inset: 0; background: rgba(10,20,20,.5); display: grid; place-items: center; z-index: 30; padding: 16px; }
  .ask div { background: var(--surface); border-radius: 14px; padding: 20px; max-width: 360px; width: 100%; display: grid; gap: 16px; }
  .ask .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ask .btns button { min-height: 48px; border-radius: 10px; font-weight: 700; border: 1px solid var(--line); }
  .ask .btns .yes { background: var(--teal); color: #fff; border-color: var(--teal); }
</style>
</head>
<body>
<header>
  <div class="t"><b>Hutbe Kumandası</b><span id="title">Bağlanıyor…</span></div>
  <span class="pill" id="pill" data-s="off">Bağlanıyor</span>
</header>

<main id="app">
  <p class="msg" id="noRoom" hidden>Bu sayfa bilgisayardaki <b>Telefon kumandası</b> düğmesinin gösterdiği QR kod okutularak açılmalı.</p>

  <section class="card now" aria-live="polite">
    <div class="row"><span class="k">Ekrandaki cümle</span><span class="no"><b id="cur">–</b> / <span id="total">–</span></span></div>
    <div class="scr" id="scr" hidden></div>
    <div class="cur" id="curText">—</div>
    <div class="nxt"><span class="k">Sıradaki</span><div id="nextText">—</div></div>
  </section>

  <section class="nav">
    <button id="bPrev" aria-label="Önceki cümle"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Geri</button>
    <button id="bNext" aria-label="Sonraki cümle"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>İleri</button>
  </section>

  <section class="card mic">
    <div><div class="k">Mikrofon</div><div class="st" id="micText">—</div></div>
    <button id="bListen" data-on="false">Dinlemeyi başlat</button>
    <div class="heard" id="heard"></div>
  </section>

  <section class="screens" aria-label="Projeksiyon ekranı">
    <button id="bSplash" aria-pressed="false">Açılış</button>
    <button id="bEnding" aria-pressed="false">Kapanış</button>
    <button id="bBlank" aria-pressed="false">Karart</button>
  </section>

  <button class="wide" id="bFirst">Başa dön</button>

  <details class="card" id="listBox">
    <summary>Cümle listesi</summary>
    <ol id="list"></ol>
  </details>
</main>

<div class="ask" id="ask" hidden><div><p id="askText"></p><div class="btns"><button id="askNo">Vazgeç</button><button class="yes" id="askYes">Evet</button></div></div></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const BROKERS = (window.HUTBE_KUMANDA_CFG && window.HUTBE_KUMANDA_CFG.brokers) || ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
  const hash = new URLSearchParams(location.hash.slice(1));
  const room = hash.get('r') || '';
  const broker = BROKERS[Math.min(+hash.get('b') || 0, BROKERS.length - 1)];
  const controls = ['#bPrev', '#bNext', '#bListen', '#bSplash', '#bEnding', '#bBlank', '#bFirst'];

  let st = null;          // bilgisayardan gelen son durum
  let rows = [];
  let freshAt = 0;        // son canlı (kayıtlı olmayan) durum mesajının geldiği an
  let client = null;
  let connected = false;

  function pill(text, s) { const p = $('#pill'); p.textContent = text; p.dataset.s = s; }
  function enable(on) { controls.forEach((c) => { $(c).disabled = !on; }); }

  if (!/^[a-z0-9]{12,}$/.test(room)) {
    $('#noRoom').hidden = false;
    pill('Kod yok', 'err');
    enable(false);
    $('#title').textContent = 'QR kodu okutun';
    return;
  }
  const base = `hutbe-ekran/v1/${room}/`;
  enable(false);

  // ---------- Bağlantı ----------
  function connect() {
    if (!window.mqtt) { pill('İnternet yok', 'err'); $('#title').textContent = 'Kumanda yüklenemedi, internet bağlantısını kontrol edin'; return; }
    client = window.mqtt.connect(broker, { clientId: 'hutbe-tel-' + Math.random().toString(36).slice(2, 10), clean: true, connectTimeout: 8000, reconnectPeriod: 3000, keepalive: 30 });
    client.on('connect', () => {
      connected = true;
      client.subscribe([base + 'status', base + 'rows']);
      beat();
      send('ping');
      render();
    });
    client.on('close', () => { connected = false; render(); });
    client.on('message', (topic, payload, packet) => {
      let d;
      try { d = JSON.parse(String(payload)); } catch (e) { return; }
      if (topic.endsWith('/rows') && Array.isArray(d)) { rows = d.map((x) => String(x)); renderList(); render(); return; }
      if (topic.endsWith('/status') && d && typeof d === 'object') {
        st = d;
        if (!packet.retain) freshAt = Date.now();
        render();
      }
    });
  }
  function beat() { if (client && connected) client.publish(base + 'phone', JSON.stringify({ t: Date.now() })); }
  setInterval(beat, 8000);
  setInterval(render, 2000);

  function send(cmd, extra) {
    if (!client || !connected) return;
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    client.publish(base + 'cmd', JSON.stringify(Object.assign({ cmd, id }, extra || {})));
    if (navigator.vibrate) navigator.vibrate(15);
  }

  // ---------- Ekran ----------
  function pcLive() { return st && st.online && Date.now() - freshAt < 25000; }
  function render() {
    if (!connected) { pill('Bağlanıyor', 'off'); enable(false); return; }
    if (!st) { pill('Bilgisayar bekleniyor', 'off'); $('#title').textContent = 'Bilgisayarda programın açık olduğundan emin olun'; enable(false); return; }
    if (st.online === false) { pill('Bilgisayar kapalı', 'err'); $('#title').textContent = 'Bilgisayarda Hutbe Ekranı kapalı'; enable(false); return; }
    if (!pcLive()) { pill('Bilgisayar yanıt vermiyor', 'err'); enable(false); }
    else { pill('Bağlı', 'on'); enable(true); }
    $('#title').textContent = st.title || 'Hutbe';
    const total = st.total | 0;
    $('#cur').textContent = total ? (st.cur | 0) + 1 : '–';
    $('#total').textContent = total || '–';
    $('#curText').textContent = rows[st.cur] || '—';
    $('#nextText').textContent = rows[(st.cur | 0) + 1] || (total ? 'Son cümle. İleri basınca kapanış ekranı açılır.' : '—');
    const scr = st.blank ? 'Projeksiyon karartıldı' : st.splash ? 'Projeksiyonda açılış ekranı var' : st.ending ? 'Projeksiyonda kapanış ekranı var' : '';
    $('#scr').textContent = scr; $('#scr').hidden = !scr;
    $('#micText').textContent = st.mic || (st.listening ? 'Dinleniyor' : 'Mikrofon kapalı');
    $('#heard').textContent = st.listening && st.heard && st.heard !== '—' ? '“' + st.heard + '”' : '';
    const L = $('#bListen');
    L.dataset.on = String(!!st.listening);
    L.textContent = st.listening ? 'Dinlemeyi durdur' : 'Dinlemeyi başlat';
    $('#bSplash').setAttribute('aria-pressed', String(!!st.splash));
    $('#bEnding').setAttribute('aria-pressed', String(!!st.ending));
    $('#bBlank').setAttribute('aria-pressed', String(!!st.blank));
    markList();
  }
  function renderList() {
    $('#list').innerHTML = rows.map((t, i) => `<li data-i="${i}"><span class="n">${i + 1}</span><span>${esc(t)}</span></li>`).join('');
    markList();
  }
  let lastMarked = -1;
  function markList() {
    if (!st) return;
    const cur = st.cur | 0;
    document.querySelectorAll('#list li').forEach((li) => {
      const i = +li.dataset.i;
      li.classList.toggle('cur', i === cur);
      li.classList.toggle('done', i < cur);
    });
    if (cur !== lastMarked && $('#listBox').open) document.querySelector('#list li.cur')?.scrollIntoView({ block: 'center' });
    lastMarked = cur;
  }

  function ask(text, yes) {
    return new Promise((res) => {
      $('#askText').textContent = text; $('#askYes').textContent = yes; $('#ask').hidden = false;
      const done = (v) => { $('#ask').hidden = true; res(v); };
      $('#askYes').onclick = () => done(true); $('#askNo').onclick = () => done(false);
    });
  }

  // ---------- Düğmeler ----------
  $('#bPrev').onclick = () => send('prev');
  $('#bNext').onclick = () => send('next');
  $('#bListen').onclick = async () => {
    const on = !(st && st.listening);
    if (!on && !(await ask('Dinleme durdurulsun mu? Ekran artık kendiliğinden ilerlemez.', 'Durdur'))) return;
    send('listen', { on });
  };
  $('#bSplash').onclick = () => send('splash', { on: !(st && st.splash) });
  $('#bEnding').onclick = () => send('ending', { on: !(st && st.ending) });
  $('#bBlank').onclick = () => send('blank', { on: !(st && st.blank) });
  $('#bFirst').onclick = async () => { if (await ask('Hutbe başa alınsın mı?', 'Başa dön')) send('first'); };
  $('#list').addEventListener('click', (e) => {
    const li = e.target.closest('li[data-i]');
    if (li && pcLive()) send('go', { i: +li.dataset.i });
  });
  $('#listBox').addEventListener('toggle', () => { lastMarked = -1; markList(); });

  // Telefon ekranı kumanda açıkken kararmasın
  let lock = null;
  async function awake() { try { if (!lock && navigator.wakeLock && document.visibilityState === 'visible') { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) { /* desteklenmiyor */ } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { awake(); beat(); send('ping'); } });
  awake();

  connect();
})();
</script>
</body>
</html>
